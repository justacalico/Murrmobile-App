name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all targets (android, linux, windows, macos, ios)'
        type: boolean
        default: true
      merge_request_id:
        description: 'Merge request ID to embed in the build (development builds only)'
        type: string
        default: ''
      merge_request_url:
        description: 'Merge request URL to embed in the build (development builds only)'
        type: string
        default: ''

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: "3.44.6"

concurrency:
  # Scope by event so a workflow_dispatch (e.g. a GitLab-triggered build)
  # does not cancel the push run that GitLab's github-sync job is watching.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup build metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      build_date: ${{ steps.meta.outputs.build_date }}
      build_all: ${{ steps.meta.outputs.build_all }}
      targets: ${{ steps.meta.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version and build metadata
        id: meta
        run: |
          VERSION=$(sed -n 's/^version: \(.*\)+.*/\1/p' pubspec.yaml | head -1)
          BUILD_NUMBER=$(date +%s | cut -c4-10)
          BUILD_DATE=$(date +%Y-%m-%d)
          if [ -n "${{ inputs.build_all }}" ]; then
            BUILD_ALL="${{ inputs.build_all }}"
          else
            BUILD_ALL="true"
          fi
          if [ "$BUILD_ALL" = "true" ]; then
            TARGETS='[{"target":"android","os":"ubuntu-latest"},{"target":"linux","os":"ubuntu-latest"},{"target":"windows","os":"windows-latest"},{"target":"macos","os":"macos-latest"},{"target":"ios","os":"macos-latest"}]'
          else
            TARGETS='[{"target":"android","os":"ubuntu-latest"}]'
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "build_all=$BUILD_ALL" >> "$GITHUB_OUTPUT"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install cocogitto
        run: |
          curl -fsSL --retry 3 -o /tmp/cog.tar.gz "https://github.com/cocogitto/cocogitto/releases/download/7.0.0/cocogitto-7.0.0-x86_64-unknown-linux-musl.tar.gz"
          sudo tar -xzf /tmp/cog.tar.gz -C /usr/local/bin --wildcards '*/cog' --strip-components=1
          cog --version

      - name: Check commits
        run: |
          if git tag -l 'v[0-9]*' | grep -q .; then
            git fetch origin main
            cog check --ignore-merge-commits origin/main..HEAD
          else
            echo "No version tags yet, skipping commit check"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Analyze and test
        run: |
          flutter config --no-analytics >/dev/null
          flutter pub get
          flutter analyze --no-fatal-infos --no-pub
          # api_real_test.dart needs a live murrtube.net session and is not
          # suitable for CI.
          xvfb-run -a flutter test --no-pub $(ls test/*_test.dart | grep -v api_real_test)

  build:
    name: Build ${{ matrix.target }}
    needs: [setup, verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.targets) }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      BUILD_NUMBER: ${{ needs.setup.outputs.build_number }}
      BUILD_DATE: ${{ needs.setup.outputs.build_date }}
      MERGE_REQUEST_ID: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.merge_request_id || '' }}
      MERGE_REQUEST_URL: ${{ github.event_name == 'pull_request' && github.event.pull_request.html_url || inputs.merge_request_url || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Java 17
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev zip

      - name: Install Android SDK
        if: matrix.target == 'android'
        run: |
          set -euo pipefail
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL --retry 3 -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm -f /tmp/cmdline-tools.zip
          for _ in $(seq 1 50); do echo y; done | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Setup Android signing
        id: signing
        if: matrix.target == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ "${{ github.ref }}" != "refs/heads/main" ] && [[ ! "${{ github.ref }}" =~ ^refs/tags/ ]]; then
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            echo "Non-main branch, using debug signing only"
            exit 0
          fi

          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            echo "Missing Android signing configuration, using debug signing"
            exit 0
          fi

          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/upload-keystore.jks 2>/dev/null; then
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            echo "Keystore base64 is invalid, using debug signing"
            exit 0
          fi

          if ! keytool -list -keystore android/app/upload-keystore.jks -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            echo "Keystore does not validate with the provided credentials, using debug signing"
            exit 0
          fi

          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/app/key.properties
          echo "signing=release" >> "$GITHUB_OUTPUT"

      - name: Build Android packages
        if: matrix.target == 'android'
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          flutter config --no-analytics >/dev/null
          flutter pub get
          MR_DART_DEFINES=()
          if [ -n "${MERGE_REQUEST_ID:-}" ]; then
            MR_DART_DEFINES+=(--dart-define=MERGE_REQUEST_ID="$MERGE_REQUEST_ID")
            MR_DART_DEFINES+=(--dart-define=MERGE_REQUEST_URL="$MERGE_REQUEST_URL")
          fi
          if [ "${{ steps.signing.outputs.signing }}" = "release" ]; then
            flutter build apk --release --build-name="$VERSION" --build-number="$BUILD_NUMBER" "${MR_DART_DEFINES[@]+"${MR_DART_DEFINES[@]}"}"
            flutter build appbundle --release --build-name="$VERSION" --build-number="$BUILD_NUMBER" "${MR_DART_DEFINES[@]+"${MR_DART_DEFINES[@]}"}"
          else
            flutter build apk --debug --build-name="$VERSION" --build-number="$BUILD_NUMBER" "${MR_DART_DEFINES[@]+"${MR_DART_DEFINES[@]}"}"
            flutter build appbundle --debug --build-name="$VERSION" --build-number="$BUILD_NUMBER" "${MR_DART_DEFINES[@]+"${MR_DART_DEFINES[@]}"}"
          fi
          if [ "${{ steps.signing.outputs.signing }}" = "release" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "$ARTIFACTS_DIR/murrmobile-android.apk"
            cp build/app/outputs/bundle/release/app-release.aab "$ARTIFACTS_DIR/murrmobile-android.aab"
          else
            cp build/app/outputs/flutter-apk/app-debug.apk "$ARTIFACTS_DIR/murrmobile-android.apk"
            cp build/app/outputs/bundle/debug/app-debug.aab "$ARTIFACTS_DIR/murrmobile-android.aab"
          fi

      - name: Build Linux package
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          flutter config --no-analytics >/dev/null
          flutter pub get
          flutter config --enable-linux-desktop
          MR_DART_DEFINES=()
          if [ -n "${MERGE_REQUEST_ID:-}" ]; then
            MR_DART_DEFINES+=(--dart-define=MERGE_REQUEST_ID="$MERGE_REQUEST_ID")
            MR_DART_DEFINES+=(--dart-define=MERGE_REQUEST_URL="$MERGE_REQUEST_URL")
          fi
          flutter build linux --release --build-name="$VERSION" --build-number="$BUILD_NUMBER" "${MR_DART_DEFINES[@]+"${MR_DART_DEFINES[@]}"}"
          tar -czf "$ARTIFACTS_DIR/murrmobile-linux-x86_64.tar.gz" -C build/linux/x64/release/bundle .

      - name: Build Windows package
        if: matrix.target == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          flutter config --no-analytics >/dev/null
          flutter pub get
          flutter config --enable-windows-desktop
          MR_DART_DEFINES=()
          if [ -n "${MERGE_REQUEST_ID:-}" ]; then
            MR_DART_DEFINES+=(--dart-define=MERGE_REQUEST_ID="$MERGE_REQUEST_ID")
            MR_DART_DEFINES+=(--dart-define=MERGE_REQUEST_URL="$MERGE_REQUEST_URL")
          fi
          flutter build windows --release --build-name="$VERSION" --build-number="$BUILD_NUMBER" "${MR_DART_DEFINES[@]+"${MR_DART_DEFINES[@]}"}"
          RELEASE_DIR="build/windows/x64/runner/Release"
          if [ ! -d "$RELEASE_DIR" ]; then
            echo "Expected Windows build output at $RELEASE_DIR is missing" >&2
            exit 1
          fi
          powershell -NoProfile -Command \
            "Compress-Archive -Path '$(cygpath -w "$RELEASE_DIR")\\*' -DestinationPath '$(cygpath -w "$ARTIFACTS_DIR/murrmobile-windows-x86_64.zip")' -Force"

      - name: Build macOS package
        if: matrix.target == 'macos'
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          flutter config --no-analytics >/dev/null
          flutter pub get
          flutter config --enable-macos-desktop
          MR_DART_DEFINES=()
          if [ -n "${MERGE_REQUEST_ID:-}" ]; then
            MR_DART_DEFINES+=(--dart-define=MERGE_REQUEST_ID="$MERGE_REQUEST_ID")
            MR_DART_DEFINES+=(--dart-define=MERGE_REQUEST_URL="$MERGE_REQUEST_URL")
          fi
          flutter build macos --release --build-name="$VERSION" --build-number="$BUILD_NUMBER" "${MR_DART_DEFINES[@]+"${MR_DART_DEFINES[@]}"}"
          APP="build/macos/Build/Products/Release/murrmobile.app"
          if [ ! -d "$APP" ]; then
            APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          fi
          codesign --force --deep --sign - "$APP"
          (cd "$(dirname "$APP")" && zip -r "$ARTIFACTS_DIR/murrmobile-macos-arm64.zip" "$(basename "$APP")" >/dev/null)

      - name: Build iOS package (unsigned)
        if: matrix.target == 'ios'
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          flutter config --no-analytics >/dev/null
          flutter pub get
          MR_DART_DEFINES=()
          if [ -n "${MERGE_REQUEST_ID:-}" ]; then
            MR_DART_DEFINES+=(--dart-define=MERGE_REQUEST_ID="$MERGE_REQUEST_ID")
            MR_DART_DEFINES+=(--dart-define=MERGE_REQUEST_URL="$MERGE_REQUEST_URL")
          fi
          flutter build ios --release --no-codesign --build-name="$VERSION" --build-number="$BUILD_NUMBER" "${MR_DART_DEFINES[@]+"${MR_DART_DEFINES[@]}"}"
          rm -rf Payload
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "$ARTIFACTS_DIR/murrmobile-ios-arm64-unsigned.ipa" Payload >/dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  nightly:
    name: Nightly release
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.setup.outputs.build_all == 'true' && github.ref == 'refs/heads/main' && inputs.merge_request_id == '' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write
    concurrency:
      # Serialize release writes across runs so a push run and a dispatch
      # run cannot race on the nightly tag or release assets.
      group: release-ops
      cancel-in-progress: false
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release tag
        id: meta
        run: echo "release_tag=nightly" >> "$GITHUB_OUTPUT"

      - name: Move nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin nightly

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -name 'murrmobile*' -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Delete existing nightly assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view nightly -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view nightly -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | while read -r asset; do
              [ -n "$asset" ] && gh release delete-asset nightly -R "$GITHUB_REPOSITORY" "$asset" --yes 2>/dev/null || true
            done
          fi

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            Automated nightly build from commit ${{ github.sha }}

            **Branch:** ${{ github.ref_name }}
            **Version:** ${{ needs.setup.outputs.version }}
            **Build:** #${{ github.run_number }}
            **Date:** ${{ needs.setup.outputs.build_date }}
            **Commit:** ${{ github.sha }}

            > This release is automatically updated on every push. Artifacts are untested nightly builds.
          files: |
            release-assets/*
            SHA256SUMS.txt
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.setup.outputs.build_all == 'true' && inputs.merge_request_id == '' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    concurrency:
      group: release-ops
      cancel-in-progress: false
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release tag
        id: meta
        run: echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -name 'murrmobile*' -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: Murrmobile ${{ steps.meta.outputs.release_tag }}
          generate_release_notes: true
          body: |
            **Version:** ${{ needs.setup.outputs.version }}
            **Build:** #${{ github.run_number }}
            **Date:** ${{ needs.setup.outputs.build_date }}
            **Commit:** ${{ github.sha }}

            ### Artifacts
            - Android APK + AAB
            - Linux desktop bundle (x86_64: tar.gz)
            - Windows package (x86_64: zip)
            - macOS app (arm64: zip)
            - iOS app (arm64: unsigned ipa)

            ### Verification
            SHA256 checksums are in `SHA256SUMS.txt`.
          files: |
            release-assets/*
            SHA256SUMS.txt
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gitlab-sync:
    name: Trigger GitLab sync
    runs-on: ubuntu-latest
    needs: [nightly, release]
    if: always() && (needs.nightly.result == 'success' || needs.release.result == 'success')
    steps:
      - name: Determine release tag
        id: meta
        run: |
          if [ "${{ needs.release.result }}" = "success" ]; then
            echo "release_tag=${{ needs.release.outputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=${{ needs.nightly.outputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger GitLab sync pipeline
        run: |
          RELEASE_TAG="${{ steps.meta.outputs.release_tag }}"
          curl -fsSL --max-time 30 --retry 2 -X POST \
            -F token="${{ secrets.GITLAB_TRIGGER_TOKEN }}" \
            -F "ref=main" \
            -F "variables[GITHUB_RUN_ID]=${{ github.run_id }}" \
            -F "variables[RELEASE_TAG]=${RELEASE_TAG}" \
            "https://gitlab.com/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/trigger/pipeline"
